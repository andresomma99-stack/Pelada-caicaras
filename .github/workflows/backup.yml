name: Backup semanal
# Toda segunda de manhã exporta os dados do banco para o branch "backups".
on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://magwhphfkofjuxiadcdx.supabase.co
      SUPABASE_KEY: sb_publishable_nML8h1TQEW3O_2b4mRPbyQ_fcW2QmT6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exportar dados
        run: |
          set -e
          DIA=$(date -u +%Y-%m-%d)
          mkdir -p /tmp/bk/$DIA
          H=(-H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json")
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/get_dados" "${H[@]}" -d '{}' > /tmp/bk/$DIA/site.json
          for T in jogadores peladas participacoes goleiros_dia eventos apelidos; do
            curl -fsS "$SUPABASE_URL/rest/v1/$T?select=*&limit=100000" "${H[@]}" > /tmp/bk/$DIA/$T.json
          done
          ls -la /tmp/bk/$DIA
      - name: Gravar no branch backups
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backups >/dev/null; then
            git fetch origin backups && git checkout backups
          else
            git checkout --orphan backups && git rm -rf . >/dev/null
          fi
          mkdir -p backups && cp -r /tmp/bk/* backups/
          git add backups
          git commit -m "Backup $(date -u +%Y-%m-%d)" || echo "Sem mudanças"
          git push origin backups
